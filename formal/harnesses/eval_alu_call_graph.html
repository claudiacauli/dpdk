<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eval_alu Call Graph</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #fafafa; font-family: system-ui, sans-serif; }
#canvas { width: 100%; height: 100%; display: block; cursor: grab; }
#canvas:active { cursor: grabbing; }
.node-group { cursor: pointer; }
.node-group:active { cursor: grabbing; }
.edge-line { fill: none; stroke: #555; stroke-width: 1.5; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.edge-hit:active { cursor: grabbing; }
.edge-handle { fill: #888; cursor: grab; }
.edge-handle:active { cursor: grabbing; }
#controls {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; z-index: 50;
}
#controls button {
  background: #fff; border: 1px solid #aaa; border-radius: 6px;
  padding: 6px 14px; font-size: 13px; cursor: pointer;
}
#controls button:hover { background: #eee; }
</style>
</head>
<body>

<svg id="canvas"></svg>

<div id="controls">
  <button onclick="resetLayout()">Reset Layout</button>
  <button onclick="toggleAutoLayout()" id="layoutBtn">Resume Auto-Layout</button>
  <button onclick="saveLayout()">Save Layout</button>
  <button onclick="document.getElementById('loadInput').click()">Load Layout</button>
  <input type="file" id="loadInput" accept=".json" style="display:none" onchange="loadLayout(event)">
</div>

<script>
const LEVEL_LABELS = [
  "Level 0 \u2013 Entry Point",
  "Level 1 \u2013 Pre-processing",
  "Level 2 \u2013 Operator Dispatch",
  "Level 3 \u2013 Helpers / Overflow",
  "Level 4 \u2013 Bit-length Helpers"
];

const nodes = [
  { id:"eval_alu",         level:0, label:"eval_alu",         params:"(bvf, ins)",             color:"#87CEEB" },

  { id:"eval_apply_mask",  level:1, label:"eval_apply_mask",  params:"(rv, mask)",             color:"#98FB98" },
  { id:"eval_fill_imm",    level:1, label:"eval_fill_imm",    params:"(rv, mask, imm)",        color:"#98FB98" },
  { id:"eval_fill_imm64",  level:1, label:"eval_fill_imm64",  params:"(rv, mask, val)",        color:"#98FB98" },
  { id:"eval_defined",     level:1, label:"eval_defined",     params:"(dst, src)",             color:"#98FB98" },

  { id:"eval_neg",         level:2, label:"eval_neg",         params:"(rd, opsz, msk)",        color:"#FFD700" },
  { id:"eval_add",         level:2, label:"eval_add",         params:"(rd, rs, msk)",          color:"#FFD700" },
  { id:"eval_sub",         level:2, label:"eval_sub",         params:"(rd, rs, msk)",          color:"#FFD700" },
  { id:"eval_lsh",         level:2, label:"eval_lsh",         params:"(rd, rs, opsz, msk)",    color:"#FFD700" },
  { id:"eval_rsh",         level:2, label:"eval_rsh",         params:"(rd, rs, opsz, msk)",    color:"#FFD700" },
  { id:"eval_arsh",        level:2, label:"eval_arsh",        params:"(rd, rs, opsz, msk)",    color:"#FFD700" },
  { id:"eval_and",         level:2, label:"eval_and",         params:"(rd, rs, opsz, msk)",    color:"#FFD700" },
  { id:"eval_or",          level:2, label:"eval_or",          params:"(rd, rs, opsz, msk)",    color:"#FFD700" },
  { id:"eval_xor",         level:2, label:"eval_xor",         params:"(rd, rs, opsz, msk)",    color:"#FFD700" },
  { id:"eval_mul",         level:2, label:"eval_mul",         params:"(rd, rs, opsz, msk)",    color:"#FFD700" },
  { id:"eval_divmod",      level:2, label:"eval_divmod",      params:"(op, rd, rs, msk)",      color:"#FFD700" },

  { id:"eval_max_bound",   level:3, label:"eval_max_bound",   params:"(rv, mask)",             color:"#DDA0DD" },
  { id:"eval_umax_bound",  level:3, label:"eval_umax_bound",  params:"(rv, mask)",             color:"#DDA0DD" },
  { id:"eval_smax_bound",  level:3, label:"eval_smax_bound",  params:"(rv, mask)",             color:"#DDA0DD" },
  { id:"eval_fill_max_bound", level:3, label:"eval_fill_max_bound", params:"(rv, mask)",       color:"#DDA0DD" },
  { id:"eval_uand_max",    level:3, label:"eval_uand_max",    params:"(v1, v2, opsz)",         color:"#DDA0DD" },
  { id:"eval_uor_max",     level:3, label:"eval_uor_max",     params:"(v1, v2, opsz)",         color:"#DDA0DD" },

  { id:"eval_umax_bits",   level:4, label:"eval_umax_bits",   params:"(v, opsz)",              color:"#F0B0B0" },
];

const EDGE_LIST = [
  ["eval_alu","eval_fill_imm"], ["eval_alu","eval_apply_mask"], ["eval_alu","eval_defined"],
  ["eval_alu","eval_add"], ["eval_alu","eval_sub"], ["eval_alu","eval_lsh"],
  ["eval_alu","eval_rsh"], ["eval_alu","eval_arsh"], ["eval_alu","eval_and"],
  ["eval_alu","eval_or"], ["eval_alu","eval_xor"], ["eval_alu","eval_mul"],
  ["eval_alu","eval_divmod"], ["eval_alu","eval_neg"], ["eval_alu","eval_max_bound"],
  ["eval_fill_imm","eval_fill_imm64"], ["eval_apply_mask","eval_smax_bound"],
  ["eval_lsh","eval_max_bound"], ["eval_rsh","eval_max_bound"], ["eval_arsh","eval_max_bound"],
  ["eval_add","eval_fill_max_bound"], ["eval_add","eval_umax_bound"], ["eval_add","eval_smax_bound"],
  ["eval_sub","eval_umax_bound"], ["eval_sub","eval_smax_bound"],
  ["eval_lsh","eval_umax_bound"], ["eval_lsh","eval_smax_bound"],
  ["eval_rsh","eval_smax_bound"],
  ["eval_and","eval_uand_max"], ["eval_and","eval_smax_bound"],
  ["eval_or","eval_uor_max"], ["eval_or","eval_smax_bound"],
  ["eval_xor","eval_uor_max"], ["eval_xor","eval_smax_bound"],
  ["eval_mul","eval_umax_bound"], ["eval_mul","eval_smax_bound"],
  ["eval_divmod","eval_smax_bound"],
  ["eval_max_bound","eval_umax_bound"], ["eval_max_bound","eval_smax_bound"],
  ["eval_fill_max_bound","eval_max_bound"],
  ["eval_uand_max","eval_umax_bits"], ["eval_uor_max","eval_umax_bits"],
];

const edges = EDGE_LIST.map(function(p){ return {source:p[0], target:p[1]}; });

const NODE_H = 42;
function nodeWidth(n) {
  var cw = 7, cp = 5.8;
  return Math.max(n.label.length * cw, n.params.length * cp) + 24;
}

var nodeMap = {};
nodes.forEach(function(n) {
  n.x = 0; n.y = 0;
  n.vx = 0; n.vy = 0;
  nodeMap[n.id] = n;
});

var levelY = [];
var levelNodes = [[],[],[],[],[]];
nodes.forEach(function(n){ levelNodes[n.level].push(n); });

var levelOrder = [
  ["eval_alu"],
  ["eval_apply_mask","eval_fill_imm","eval_fill_imm64","eval_defined"],
  ["eval_neg","eval_add","eval_sub","eval_lsh","eval_rsh","eval_arsh",
   "eval_and","eval_or","eval_xor","eval_mul","eval_divmod"],
  ["eval_max_bound","eval_umax_bound","eval_smax_bound",
   "eval_fill_max_bound","eval_uand_max","eval_uor_max"],
  ["eval_umax_bits"],
];

var svg = document.getElementById("canvas");
var ns = "http://www.w3.org/2000/svg";

function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  svg.setAttribute("viewBox", "0 0 "+w+" "+h);
  svg.setAttribute("width", w);
  svg.setAttribute("height", h);
  var gap = Math.min(h / 4, 280);
  for (var i = 0; i < 5; i++)
    levelY[i] = 60 + i * gap;
}
window.addEventListener("resize", resize);

var SPRING_K = 0.008;
var REPULSE_K = 3000;
var LEVEL_Y_K = 0.04;
var DAMPING = 0.85;
var MIN_VEL = 0.1;
var layoutRunning = false;

function tick() {
  if (!layoutRunning) return;
  edges.forEach(function(e) {
    var a = nodeMap[e.source], b = nodeMap[e.target];
    if (!a || !b) return;
    var dx = b.x - a.x, dy = b.y - a.y;
    var dist = Math.sqrt(dx*dx + dy*dy) || 1;
    var force = (dist - 180) * SPRING_K;
    var fx = (dx/dist) * force, fy = (dy/dist) * force;
    if (!a.pinned) { a.vx += fx; a.vy += fy; }
    if (!b.pinned) { b.vx -= fx; b.vy -= fy; }
  });
  for (var i = 0; i < nodes.length; i++) {
    for (var j = i+1; j < nodes.length; j++) {
      var a = nodes[i], b = nodes[j];
      var dx = b.x - a.x, dy = b.y - a.y;
      var dist = Math.sqrt(dx*dx + dy*dy) || 1;
      var force = REPULSE_K / (dist*dist);
      var fx = (dx/dist)*force, fy = (dy/dist)*force;
      if (!a.pinned) { a.vx -= fx; a.vy -= fy; }
      if (!b.pinned) { b.vx += fx; b.vy += fy; }
    }
  }
  nodes.forEach(function(n) {
    if (n.pinned) return;
    n.vy += (levelY[n.level] - n.y) * LEVEL_Y_K;
  });
  var totalSpeed = 0;
  nodes.forEach(function(n) {
    if (n.pinned) { n.vx = 0; n.vy = 0; return; }
    n.vx *= DAMPING; n.vy *= DAMPING;
    if (Math.abs(n.vx) < MIN_VEL) n.vx = 0;
    if (Math.abs(n.vy) < MIN_VEL) n.vy = 0;
    n.x += n.vx; n.y += n.vy;
    totalSpeed += Math.abs(n.vx) + Math.abs(n.vy);
  });
  render();
  if (totalSpeed < 0.5) {
    layoutRunning = false;
    document.getElementById("layoutBtn").textContent = "Resume Auto-Layout";
    return;
  }
  requestAnimationFrame(tick);
}

var bgGroup, edgeGroup, nodeGroup;

function initRender() {
  while (svg.lastChild) svg.removeChild(svg.lastChild);
  var defs = document.createElementNS(ns, "defs");
  defs.innerHTML = '<marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker>';
  svg.appendChild(defs);
  bgGroup = document.createElementNS(ns, "g");
  svg.appendChild(bgGroup);
  edgeGroup = document.createElementNS(ns, "g");
  svg.appendChild(edgeGroup);
  nodeGroup = document.createElementNS(ns, "g");
  svg.appendChild(nodeGroup);
  nodes.forEach(function(n) {
    var g = document.createElementNS(ns, "g");
    g.setAttribute("class", "node-group");
    var rect = document.createElementNS(ns, "rect");
    rect.setAttribute("rx", "4"); rect.setAttribute("ry", "4");
    rect.setAttribute("fill", n.color);
    rect.setAttribute("stroke", "#666"); rect.setAttribute("stroke-width", "1");
    g.appendChild(rect);
    var title = document.createElementNS(ns, "text");
    title.setAttribute("text-anchor", "middle");
    title.setAttribute("font-weight", "bold");
    title.setAttribute("font-size", "12"); title.setAttribute("fill", "#111");
    g.appendChild(title);
    var sub = document.createElementNS(ns, "text");
    sub.setAttribute("text-anchor", "middle");
    sub.setAttribute("font-size", "10"); sub.setAttribute("fill", "#333");
    g.appendChild(sub);
    n._g = g; n._rect = rect; n._title = title; n._subtitle = sub;
    g.addEventListener("pointerdown", function(e) {
      e.stopPropagation();
      n.pinned = true;
      n._dragOffX = e.clientX - n.x;
      n._dragOffY = e.clientY - n.y;
      g.setPointerCapture(e.pointerId);
      layoutRunning = false;
      document.getElementById("layoutBtn").textContent = "Resume Auto-Layout";
    });
    g.addEventListener("pointermove", function(e) {
      if (!n.pinned) return;
      n.x = e.clientX - n._dragOffX;
      n.y = e.clientY - n._dragOffY;
      n.vx = 0; n.vy = 0;
      render();
    });
    g.addEventListener("pointerup", function(){ n.pinned = false; });
    g.addEventListener("pointercancel", function(){ n.pinned = false; });
    nodeGroup.appendChild(g);
  });
  edges.forEach(function(e) {
    e._bend = 0;
    e._dragging = false;

    var hit = document.createElementNS(ns, "path");
    hit.setAttribute("class", "edge-hit");
    e._hit = hit;
    edgeGroup.appendChild(hit);

    var path = document.createElementNS(ns, "path");
    path.setAttribute("class", "edge-line");
    path.setAttribute("marker-end", "url(#arrow)");
    e._path = path;
    edgeGroup.appendChild(path);

    var handle = document.createElementNS(ns, "circle");
    handle.setAttribute("r", "5");
    handle.setAttribute("class", "edge-handle");
    handle.setAttribute("display", "none");
    e._handle = handle;
    edgeGroup.appendChild(handle);

    hit.addEventListener("pointerdown", function(ev) {
      ev.stopPropagation();
      e._dragging = true;
      e._prevY = ev.clientY;
      hit.setPointerCapture(ev.pointerId);
    });
    hit.addEventListener("pointermove", function(ev) {
      if (!e._dragging) return;
      var dy = ev.clientY - e._prevY;
      e._bend += dy * 0.5;
      e._prevY = ev.clientY;
      render();
    });
    hit.addEventListener("pointerup", function(){ e._dragging = false; });
    hit.addEventListener("pointercancel", function(){ e._dragging = false; });
    hit.addEventListener("mouseenter", function(){ handle.setAttribute("display", "inline"); });
    hit.addEventListener("mouseleave", function(){ if (!e._dragging) handle.setAttribute("display", "none"); });
  });
}

function render() {
  nodes.forEach(function(n) {
    var g = n._g;
    if (!g) return;
    var nw = nodeWidth(n);
    var x = n.x - nw/2, y = n.y - NODE_H/2;
    n._rect.setAttribute("x", x);
    n._rect.setAttribute("y", y);
    n._rect.setAttribute("width", nw);
    n._rect.setAttribute("height", NODE_H);
    n._title.setAttribute("x", n.x);
    n._title.setAttribute("y", n.y - 2);
    n._title.textContent = n.label;
    n._subtitle.setAttribute("x", n.x);
    n._subtitle.setAttribute("y", n.y + 13);
    n._subtitle.textContent = n.params;
  });
  edges.forEach(function(e) {
    var a = nodeMap[e.source], b = nodeMap[e.target];
    if (!a || !b || !e._path) return;
    var dx = b.x - a.x, dy = b.y - a.y;
    var dist = Math.sqrt(dx*dx + dy*dy) || 1;
    // compute intersection with source bounding box
    var adx = Math.abs(dx), ady = Math.abs(dy);
    var hwA = nodeWidth(a)/2, hwB = nodeWidth(b)/2, hh = NODE_H/2;
    var denomX = adx || 1, denomY = ady || 1;
    var sA = Math.min(hwA * dist / denomX, hh * dist / denomY);
    var x1 = a.x + dx/dist * sA, y1 = a.y + dy/dist * sA;
    // compute intersection with target bounding box
    var sB = Math.min(hwB * dist / denomX, hh * dist / denomY);
    var x2 = b.x - dx/dist * sB, y2 = b.y - dy/dist * sB;
    var len = Math.sqrt(dx*dx + dy*dy) || 1;
    var autoBend = Math.max(20, len * 0.18);
    var totalBend = autoBend + e._bend;
    var perpX = -dy/len * totalBend;
    var perpY =  dx/len * totalBend;
    var cp1x = x1 + dx*0.3 + perpX;
    var cp1y = y1 + dy*0.3 + perpY;
    var cp2x = x2 - dx*0.3 + perpX;
    var cp2y = y2 - dy*0.3 + perpY;
    var d = "M"+x1+","+y1+" C"+cp1x+","+cp1y+" "+cp2x+","+cp2y+" "+x2+","+y2;
    e._path.setAttribute("d", d);
    e._hit.setAttribute("d", d);
    var mx = (x1+x2)/2 + perpX;
    var my = (y1+y2)/2 + perpY;
    e._handle.setAttribute("cx", mx);
    e._handle.setAttribute("cy", my);
  });
  while (bgGroup.firstChild) bgGroup.removeChild(bgGroup.firstChild);
  for (var L = 0; L < 5; L++) {
    var lns = levelNodes[L];
    if (lns.length === 0) continue;
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    lns.forEach(function(n) {
      var nw = nodeWidth(n);
      if (n.x - nw/2 < minX) minX = n.x - nw/2;
      if (n.x + nw/2 > maxX) maxX = n.x + nw/2;
      if (n.y - NODE_H/2 < minY) minY = n.y - NODE_H/2;
      if (n.y + NODE_H/2 > maxY) maxY = n.y + NODE_H/2;
    });
    var pad = 24;
    var rx = document.createElementNS(ns, "rect");
    rx.setAttribute("data-level", L);
    rx.setAttribute("x", minX - pad);
    rx.setAttribute("y", minY - pad - 16);
    rx.setAttribute("width", maxX - minX + pad*2);
    rx.setAttribute("height", maxY - minY + pad*2 + 16);
    rx.setAttribute("rx", "8");
    rx.setAttribute("fill", "#f4f4f4");
    rx.setAttribute("stroke", "#bbb");
    rx.setAttribute("stroke-width", "1.5");
    rx.setAttribute("stroke-dasharray", "6,3");
    bgGroup.appendChild(rx);
    var lbl = document.createElementNS(ns, "text");
    lbl.setAttribute("x", minX - pad + 8);
    lbl.setAttribute("y", minY - pad);
    lbl.setAttribute("font-size", "11");
    lbl.setAttribute("fill", "#777");
    lbl.setAttribute("font-weight", "bold");
    lbl.textContent = LEVEL_LABELS[L];
    bgGroup.appendChild(lbl);
  }
}

function initPositions() {
  var w = window.innerWidth;
  nodes.forEach(function(n) {
    var idx = levelOrder[n.level].indexOf(n.id);
    var count = levelOrder[n.level].length;
    var span = Math.min(w * 0.7, count * (nodeWidth(n) + 30));
    var startX = (w - span) / 2;
    var xGap = count > 1 ? span / (count - 1) : 0;
    n.x = startX + (count > 1 ? idx * xGap : span/2);
    n.y = levelY[n.level];
    n.vx = 0; n.vy = 0;
    n.pinned = false;
  });
  // nest eval_fill_imm64 directly below eval_fill_imm
  var imm = nodeMap["eval_fill_imm"];
  var imm64 = nodeMap["eval_fill_imm64"];
  if (imm && imm64) {
    imm64.x = imm.x;
    imm64.y = levelY[1] + NODE_H + 8;
  }
}

function resetLayout() {
  initPositions();
  render();
}

function toggleAutoLayout() {
  if (layoutRunning) {
    layoutRunning = false;
    document.getElementById("layoutBtn").textContent = "Resume Auto-Layout";
  } else {
    layoutRunning = true;
    document.getElementById("layoutBtn").textContent = "Pause Auto-Layout";
    tick();
  }
}

function saveLayout() {
  var data = {};
  nodes.forEach(function(n){ data[n.id] = { x: n.x, y: n.y }; });
  var blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "eval_alu_layout.json";
  a.click();
}

function loadLayout(ev) {
  var file = ev.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      nodes.forEach(function(n) {
        if (data[n.id]) { n.x = data[n.id].x; n.y = data[n.id].y; }
      });
      render();
    } catch(err) { alert("Invalid layout file"); }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

var panning = false, panX = 0, panY = 0;
var dragLevel = -1, dragLX = 0, dragLY = 0;
svg.addEventListener("pointerdown", function(e) {
  var level = e.target.getAttribute ? e.target.getAttribute("data-level") : null;
  if (level !== null) {
    dragLevel = parseInt(level);
    dragLX = e.clientX; dragLY = e.clientY;
    return;
  }
  if (e.target === svg || e.target === bgGroup || e.target === edgeGroup) {
    panning = true;
    panX = e.clientX; panY = e.clientY;
  }
});
svg.addEventListener("pointermove", function(e) {
  if (dragLevel >= 0) {
    var dx = e.clientX - dragLX, dy = e.clientY - dragLY;
    levelNodes[dragLevel].forEach(function(n){ n.x += dx; n.y += dy; });
    dragLX = e.clientX; dragLY = e.clientY;
    render();
    return;
  }
  if (!panning) return;
  var dx = e.clientX - panX, dy = e.clientY - panY;
  nodes.forEach(function(n){ n.x += dx; n.y += dy; });
  panX = e.clientX; panY = e.clientY;
  render();
});
svg.addEventListener("pointerup", function(){ panning = false; dragLevel = -1; });
svg.addEventListener("pointercancel", function(){ panning = false; dragLevel = -1; });

resize();
initPositions();
initRender();
render();
// No auto-layout at startup — the static hierarchical layout is clean.
// Click "Resume Auto-Layout" to enable force-directed positioning.
</script>
</body>
</html>
